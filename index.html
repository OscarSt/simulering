<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lindhaven investeringssimulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: seminariet är ett ärende som växer. Höger = faktablad med nya uppgifter överst och grundcaset under, vänster = aktuell etapp (PM + frågor). Genomgången efter lärarens kod ligger under. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#e9edf4; --ink:#101826; --ink-2:#465063; --muted:#788296;
  --line:#d5dbe6; --grid:#e4e8ef; --axis:#b8c0cd; --accent:#1f3864; --accent-ink:#ffffff;
  --s-a:#2a78d6; --s-b:#eb6834; --s-c:#1baf7a;
  --good:#0a6b0a; --good-bg:#e3f3e3; --bad:#b3261e; --bad-bg:#fbe6e4; --warn-bg:#fdf1d6; --wash-bad:rgba(208,59,59,.09);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161c26; --surface-2:#1f2733; --ink:#f1f4f9; --ink-2:#b7c0ce; --muted:#8791a1;
  --line:#2b3545; --grid:#232c3a; --axis:#3a4557; --accent:#9dbcff; --accent-ink:#0d1117;
  --s-a:#3987e5; --s-b:#d95926; --s-c:#199e70;
  --good:#5fd35f; --good-bg:#12301a; --bad:#ff8a80; --bad-bg:#3a1a1a; --warn-bg:#3a3014; --wash-bad:rgba(230,103,103,.13);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161c26; --surface-2:#1f2733; --ink:#f1f4f9; --ink-2:#b7c0ce; --muted:#8791a1;
  --line:#2b3545; --grid:#232c3a; --axis:#3a4557; --accent:#9dbcff; --accent-ink:#0d1117;
  --s-a:#3987e5; --s-b:#d95926; --s-c:#199e70;
  --good:#5fd35f; --good-bg:#12301a; --bad:#ff8a80; --bad-bg:#3a1a1a; --warn-bg:#3a3014; --wash-bad:rgba(230,103,103,.13);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px;line-height:1.2}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:10px 18px;font-size:16px}
.btn.primary.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
header.top .lede{color:var(--ink-2);max-width:70ch;margin-top:6px}

/* ---------- simulering ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 4px;background:var(--surface)}
.steps li b{font-family:var(--f-num);font-weight:600;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);font-size:12px}
.steps li.done{color:var(--ink-2)} .steps li.done b{background:var(--ink-2);color:var(--surface)}
.steps li.now{color:var(--ink);border-color:var(--ink);font-weight:600} .steps li.now b{background:var(--accent);color:var(--accent-ink)}
.sim{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){ .sim.two{grid-template-columns:minmax(0,1fr) 330px;align-items:start} }
.stage{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.memo{display:grid;gap:12px}
.memo .mhead{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.memo .mhead dt{color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;padding-top:2px}
.memo .mhead dd{margin:0}
.memo .mhead dd.subj{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.2}
.memo p,.memo li{max-width:68ch}
.memo ul{margin:0;padding-left:20px;display:grid;gap:4px}
.memo .alts3{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.memo .alts3 div{background:var(--surface-2);border-radius:6px;padding:9px 12px;font-size:13.5px}
.memo .alts3 b{display:block}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.qhead .time{font-size:13px;color:var(--muted)}
.rules{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 12px}
form.q{display:grid;gap:18px}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.fld>.lab,.fld legend{font-weight:500;padding:0;max-width:70ch}
.fld .help{font-size:13px;color:var(--muted)}
.fld.err>label,.fld.err>.lab,.fld.err legend{color:var(--bad)}
.fld.err input,.fld.err textarea,.fld.err select{border-color:var(--bad)}
fieldset.fld{border:0;margin:0;padding:0}
.numrow{display:flex;align-items:baseline;gap:8px}
.numrow input{width:130px;text-align:right;font-family:var(--f-num);border:1px solid var(--axis);background:var(--bg);border-radius:6px;padding:6px 9px;font-size:16px}
.numrow span{color:var(--ink-2)}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer;font-weight:400}
.opts label:has(input:checked){border-color:var(--accent);background:var(--surface-2)}
.opts input{margin-top:4px;accent-color:var(--accent)}
textarea{width:100%;border:1px solid var(--axis);background:var(--bg);border-radius:6px;padding:8px 10px;resize:vertical;line-height:1.5}
.sel{border:1px solid var(--axis);background:var(--bg);border-radius:6px;padding:6px 8px;max-width:100%}
.clsgrid{display:grid;gap:8px 14px;grid-template-columns:minmax(0,1fr) auto}
.clsgrid .it{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.clsgrid .it span:last-child{font-family:var(--f-num);color:var(--ink-2);white-space:nowrap}
@media (max-width:620px){ .clsgrid{grid-template-columns:minmax(0,1fr)} .clsgrid .sel{margin-bottom:6px} }
.wc{font-size:12.5px;color:var(--muted);font-family:var(--f-num)}
.fld.err .wc{color:var(--bad);font-weight:600}
.go{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.go .msg{color:var(--bad);font-weight:500}
.facts{display:grid;gap:12px;font-size:13.5px}
@media (min-width:980px){ .facts{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 14px);max-height:calc(100vh - 28px);overflow:auto} }
.facts dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px}
.facts dt{color:var(--ink-2)} .facts dd{margin:0;text-align:right;font-family:var(--f-num);white-space:nowrap}
.facts dd s{color:var(--muted);margin-right:6px}
.facts .new{background:var(--warn-bg);border-radius:4px;padding:0 4px}
.facts .fg{display:grid;gap:5px;padding-top:10px;border-top:1px solid var(--line)}
.facts .fg:first-of-type{border-top:0;padding-top:0}
.prev details{border-top:1px solid var(--line);padding:10px 0 2px}
.prev details:first-of-type{border-top:0}
.prev summary{cursor:pointer;font-weight:500}
.prev .inner{display:grid;gap:12px;padding:12px 0 6px}
.startgrid{display:grid;gap:14px;max-width:560px}
.startgrid input[type=text]{width:100%;border:1px solid var(--axis);background:var(--bg);border-radius:6px;padding:8px 10px;font-size:16px}
.how{margin:0;padding-left:20px;display:grid;gap:5px;max-width:70ch}

/* ---------- tabeller ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--axis)}
td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.sum td{font-weight:600;border-top:1px solid var(--axis)}
tr.strong td{font-weight:600}
table.ans td,table.ans th{text-align:left;white-space:normal}
table.ans td:first-child{width:46%;color:var(--ink-2)}
table.ans tr.sh td{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink);padding-top:14px;border-bottom:1px solid var(--axis)}
table.cmp td,table.cmp th{white-space:normal;text-align:left;min-width:120px}
table.cmp td:first-child{min-width:200px;color:var(--ink-2)}
table.cmp td .why{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;max-width:46ch}
table.cmp tr.sh td{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink);padding-top:16px;border-bottom:1px solid var(--axis)}
.tag{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.tag.same{background:var(--good-bg);border-color:transparent;color:var(--good)}
.tag.own{background:var(--warn-bg);border-color:transparent}
.tag.diff{background:var(--bad-bg);border-color:transparent;color:var(--bad)}

/* ---------- genomgång och utforskare ---------- */
#disc{display:grid;gap:18px;margin-top:26px;padding-top:22px;border-top:2px solid var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.panel .phead{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.panel .pdesc{color:var(--ink-2);font-size:13.5px;max-width:78ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-weight:500;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bench{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"summary" "controls" "detail"}
@media (min-width:940px){ .bench{grid-template-columns:330px minmax(0,1fr);grid-template-areas:"controls summary" "controls detail";align-items:start} }
.summary{grid-area:summary;display:grid;gap:14px;min-width:0}
.detail{grid-area:detail;display:grid;gap:18px;min-width:0}
.controls{grid-area:controls;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:12px;min-width:0}
@media (min-width:940px){ .controls{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 14px);max-height:calc(100vh - 28px);overflow:auto} }
.controls .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.group{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.ctl{display:grid;gap:3px;min-width:0}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-weight:500;min-width:0}
.ctl .val{display:flex;align-items:baseline;gap:5px;color:var(--ink-2);font-size:13px;flex:none;white-space:nowrap}
.ctl input[type=number]{width:86px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 6px;font-family:var(--f-num);font-size:14px}
.ctl input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
.ctl .hint{font-size:12px;color:var(--muted);min-height:17px;line-height:1.35}
.ctl .hint.changed{color:var(--ink)}
.check{display:flex;gap:9px;align-items:flex-start}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.check small{display:block;color:var(--muted);font-size:12px}
.verdict{display:flex;gap:14px;align-items:center;border-radius:8px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.verdict.good{background:var(--good-bg);border-color:transparent}
.verdict.bad{background:var(--bad-bg);border-color:transparent}
.verdict svg{flex:none;width:34px;height:34px}
.verdict.good svg{color:var(--good)} .verdict.bad svg{color:var(--bad)}
.verdict .big{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1.15}
.verdict .sub{color:var(--ink-2);margin-top:2px}
.alts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;display:grid;gap:8px;min-width:0}
.alt.best{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.alt .name{display:flex;align-items:center;gap:8px;font-weight:600}
.alt .key{width:18px;height:4px;border-radius:2px;flex:none}
.alt .btag{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--ink);border-radius:999px;padding:0 7px}
.alt .desc{font-size:12.5px;color:var(--muted);margin-top:-5px}
.alt .npv{font-family:var(--f-num);font-size:29px;font-weight:600;line-height:1.05}
.alt .npv small{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:4px}
.alt .delta{font-size:12.5px;color:var(--ink-2);min-height:19px}
.alt dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.alt dt{color:var(--ink-2)} .alt dd{margin:0;text-align:right;font-family:var(--f-num)}
.notes{display:grid;gap:6px}
.note{font-size:13.5px;background:var(--surface-2);border-radius:6px;padding:8px 12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.chart text.lab{fill:var(--ink);font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-family:var(--f-num);font-weight:600}
.tip .t{opacity:.75;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:7px}
.tip .r i{width:12px;height:3px;border-radius:2px;display:inline-block}
.tip .r span{margin-left:auto;padding-left:12px}
.unc{display:grid;gap:12px 22px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.unc .ctl label{font-weight:400;font-size:13.5px}
.unc .ctl .hint{display:none}
.unc .ctl input[type=number]{width:72px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:500;color:var(--ink-2)}
details.more[open] summary{margin-bottom:10px}
.fixed{columns:2 260px;column-gap:28px;margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.fixed li{break-inside:avoid;margin-bottom:3px}
.gate{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.gate input{border:1px solid var(--axis);background:var(--bg);border-radius:6px;padding:7px 10px;width:200px;font-family:var(--f-num)}
.gate .msg{color:var(--bad)}
footer{margin-top:26px;color:var(--muted);font-size:12.5px;display:grid;gap:10px;max-width:90ch}
@media (max-width:520px){ h1{font-size:25px} .alt .npv{font-size:26px} .wrap{padding-inline:16px} .card{padding:15px 15px} }
.rng{font-size:13px;color:var(--bad);font-weight:500}
.rng:empty{display:none}
.negtop{display:grid;gap:10px 22px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface-2);border-radius:8px;padding:12px 16px}
.negtop .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.negtop .v{font-size:24px;font-weight:600;line-height:1.2}
.neglog{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.neglog li{display:grid;gap:1px;max-width:62ch;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.neglog li.vi{justify-self:end;background:var(--surface-2);border-color:transparent}
.neglog li b{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.negact{display:grid;gap:6px}
.negact .numrow{flex-wrap:wrap;align-items:center}
.negact .msg{color:var(--bad);font-weight:500}
.events{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.events li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;font-size:14px;border-left:3px solid var(--axis);padding:2px 0 2px 10px}
.events li b{font-family:var(--f-num);font-weight:600}
.pdesc{color:var(--ink-2);font-size:13.5px;max-width:78ch}
</style>

:root[data-theme="dark"]{
  --bg:#0c1517; --surface:#142126; --surface-2:#1b2b30; --ink:#e9f1ef; --ink-2:#b2c3c0; --muted:#86999a;
  --line:#26383d; --grid:#1f3035; --axis:#3a5056; --accent:#5ec4bd; --accent-ink:#06201f; --accent-2:#7fd6cf;
  --capsule:#f3c443; --capsule-bg:#3a3214; --s-a:#5b8ff0; --s-b:#ee8a3a; --s-c:#2cbf95;
  --good:#5ad39a; --good-bg:#11301f; --bad:#ff8b7c; --bad-bg:#3a1a16; --warn-bg:#3a3214;
  --hud:#081b1e; --hud-ink:#e6f1ef; --hud-2:#7fa6a1; color-scheme:dark }
body{font-size:15.5px;line-height:1.55;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2{font-weight:650;letter-spacing:-.01em}
h2{font-size:22px}
h3{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink-2)}
.wrap{padding-block:0 48px}
.card{border-radius:14px;border-color:var(--line)}
.btn{border-radius:10px}
.btn.primary{border-radius:10px;font-weight:600;padding:11px 20px}
.btn.primary.armed{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 22%,transparent)}}

/* ---- HUD: företagets statusrad ---- */
.hud{position:sticky;top:0;z-index:20;margin:0 -20px 20px;padding:10px 20px;background:var(--hud);color:var(--hud-ink);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px 22px;align-items:center;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand span{display:block;font-size:12.5px;color:var(--hud-2);line-height:1.3}
.hud .steps{margin:0;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.hud .steps li{background:transparent;border:0;border-radius:0;padding:0;color:var(--hud-2);flex:1 1 0;min-width:74px;display:grid;gap:5px;font-size:12px;white-space:nowrap}
.hud .steps li::before{content:"";height:5px;border-radius:3px;background:color-mix(in srgb,var(--hud-ink) 18%,transparent)}
.hud .steps li.done::before{background:var(--hud-2)}
.hud .steps li.now::before{background:var(--capsule)}
.hud .steps li.now{color:var(--hud-ink);font-weight:600;border:0}
.hud .steps li b{display:none}
.timer{display:grid;justify-items:end;gap:1px;min-width:92px}
.timer .t{font-family:var(--f-display);font-size:24px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.timer .l{font-size:11.5px;color:var(--hud-2)}
.timer.low .t{color:var(--capsule)}
.timer.over .t{color:#ff9d8f}
.hud .btn.quiet{color:var(--hud-2);padding:4px 6px;font-size:13px}
.decisions{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.decisions .stamp{display:inline-flex;gap:8px;align-items:baseline;border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;padding:4px 10px;font-size:13px;background:var(--surface)}
.decisions .stamp b{font-weight:650}
.decisions .stamp.fresh{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(1.35) rotate(-4deg);opacity:0}}
@media (max-width:820px){ .hud{grid-template-columns:minmax(0,1fr) auto auto;margin-inline:-16px;padding-inline:16px} .hud .steps{grid-column:1/-1;order:3} .brand span{display:none} }

/* ---- start ---- */
.hero{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start;padding:18px 0 8px}
@media (min-width:900px){ .hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px} }
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.025em;font-weight:700;max-width:14ch}
.hero .lead{font-size:18px;color:var(--ink-2);max-width:52ch;margin-top:14px}
.hero .how{margin-top:22px;padding:0;list-style:none;counter-reset:s;gap:10px}
.hero .how li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:baseline}
.hero .how li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);border:1.5px solid var(--accent);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.join{display:grid;gap:14px;border-radius:16px;padding:22px;border-top:6px solid var(--accent)}
.join h2{font-size:24px}
.join .pass{font-size:13.5px;color:var(--muted)}
.startgrid{max-width:none}

/* ---- meddelandet ---- */
.memo{gap:14px}
.memo .from{display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;flex:none}
.memo .from .who{display:grid;line-height:1.3}
.memo .from .who b{font-weight:600}
.memo .from .who span{font-size:13px;color:var(--muted)}
.memo .from .pill{margin-left:auto;background:var(--capsule);color:#1d1600;font-weight:600;font-size:12.5px;border-radius:999px;padding:2px 10px}
.memo h2.subj{font-size:clamp(24px,3vw,32px);line-height:1.12;letter-spacing:-.015em;font-weight:700}
.memo p{font-size:16.5px;line-height:1.6}
.card.arrive{animation:arrive .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(-14px) scale(.985);box-shadow:0 0 0 3px var(--capsule)}}
.qhead h2{font-size:20px}
.rules{border-radius:10px;border-left:4px solid var(--accent);background:var(--surface-2)}
form.q{counter-reset:q}
form.q>.fld{counter-increment:q;position:relative;padding-left:40px}
form.q>.fld::before{content:counter(q);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-family:var(--f-display);font-weight:700;display:grid;place-items:center;font-size:14px}
form.q>.fld.err::before{background:var(--bad-bg);color:var(--bad)}
.numrow input,.ctl input[type=number],.gate input{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.numrow input{font-size:18px;font-weight:600;width:150px;border-radius:10px;border-width:1.5px;background:var(--surface)}
.numrow input:focus{border-color:var(--accent)}
.opts label{border-radius:10px;padding:9px 12px}
.opts label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));box-shadow:inset 0 0 0 1px var(--accent)}
textarea,.sel,.startgrid input[type=text]{border-radius:10px}

/* ---- faktabladet ---- */
@media (min-width:980px){ .sim.two{grid-template-columns:minmax(0,1fr) 360px} .facts{top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px)} }
.facts h2{font-size:18px}
.facts .rowsf{display:grid;gap:0}
.facts .fr{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--grid)}
.facts .fr:last-child{border-bottom:0}
.facts .fr .k{color:var(--ink-2);min-width:0}
.facts .fr .v{text-align:right;white-space:nowrap;font-weight:500}
.facts .fr .v s{display:block;font-size:12px;color:var(--muted);font-weight:400}
.facts .fr.new{background:var(--capsule-bg);border-radius:8px;padding:6px 8px;margin:2px 0;border-bottom:0}
.facts .fr.new .v{font-weight:700}
.facts .fg.decided{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px}
.facts details.base summary{cursor:pointer;font-weight:600;color:var(--ink-2);padding:4px 0}

/* ---- förhandlingen ---- */
.negtop{background:var(--hud);color:var(--hud-ink);border-radius:14px;padding:16px 18px}
.negtop .k{text-transform:none;letter-spacing:0;font-size:13px;color:var(--hud-2)}
.negtop .v{font-family:var(--f-display);font-size:30px;font-weight:700}
.pips{display:flex;gap:6px;margin-top:8px}
.pips i{width:22px;height:8px;border-radius:4px;background:var(--capsule)}
.pips i.used{background:color-mix(in srgb,var(--hud-ink) 22%,transparent)}
.neglog{gap:10px}
.neglog li{grid-template-columns:36px minmax(0,1fr);column-gap:10px;border:0;padding:0;max-width:60ch;background:transparent}
.neglog li .avatar{width:34px;height:34px;font-size:14px;grid-row:span 2}
.neglog li b{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted);font-weight:600}
.neglog li .txt{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:9px 13px}
.neglog li.vi{justify-self:end;grid-template-columns:minmax(0,1fr)}
.neglog li.vi b{text-align:right}
.neglog li.vi .txt{background:var(--accent);color:var(--accent-ink);border-radius:14px 4px 14px 14px}
.neglog li.fresh .txt{position:relative}
.neglog li.fresh .txt>span{animation:revealTxt .01s 1.1s both}
.neglog li.fresh .txt::after{content:"";position:absolute;left:14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--muted);box-shadow:11px 0 0 var(--muted),22px 0 0 var(--muted);animation:typing 1.1s steps(3,end) both}
@keyframes revealTxt{from{visibility:hidden}}
@keyframes typing{0%{opacity:.3}50%{opacity:1}99%{opacity:.6}100%{opacity:0;visibility:hidden}}

/* ---- utfallet ---- */
.outhead{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--hud);color:var(--hud-ink);border-radius:14px;padding:16px 18px}
.outhead .k{font-size:13px;color:var(--hud-2)}
.outhead .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.outhead .v.pos{color:#7fe0b4} .outhead .v.neg{color:#ff9d8f}
.events li{border-left-color:var(--capsule);background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px 8px 12px}
.events li.fresh{animation:arrive .6s cubic-bezier(.2,.9,.3,1) both}
.note{border-radius:10px;border-left:4px solid var(--accent);font-size:15px}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important} }
.hud{margin-inline:0;box-shadow:0 0 0 100vmax var(--hud);clip-path:inset(0 -100vmax)}
.hud .brand{grid-column:1} .hud .steps{grid-column:2} .hud .timer{grid-column:3} .hud #restart{grid-column:4;justify-self:end}
@media (max-width:820px){ .hud{margin-inline:0} .hud .brand{grid-column:1} .hud .timer{grid-column:2} .hud #restart{grid-column:3} .hud .steps{grid-column:1/-1;grid-row:2} }
fieldset.fld>legend{float:left;width:100%;margin-bottom:6px}
fieldset.fld>legend+*{clear:both}
.facts .fr .v .old{display:block;font-size:12px;color:var(--muted);font-weight:400}
.neglog li.vi b{grid-column:1}
@media (max-width:820px){ .hud .steps li{min-width:0} .hud .steps li:not(.now){font-size:0;gap:0} }
table.val td{white-space:normal;text-align:left;vertical-align:middle}
table.val td.n{text-align:right;white-space:nowrap;font-weight:600;width:1%}
table.val td.barcell{width:38%;min-width:90px}
table.val td.barcell i{display:block;height:12px;border-radius:6px}
.tablewrap.tall{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tablewrap.tall thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.tablewrap.tall td:first-child,.tablewrap.tall th:first-child{white-space:nowrap}
td .why{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;max-width:60ch}
.teachpick{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.timer .l.tot{color:var(--hud-ink);opacity:.8}
.timer .l.tot.late{color:#ff9d8f;opacity:1}
.time.warnrun{color:var(--bad);font-weight:600}
ol.pres{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:p}
ol.pres li{counter-increment:p;display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px}
ol.pres li::before{content:counter(p);grid-row:span 2;font-family:var(--f-display);font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px}
ol.pres li b{font-weight:600}
ol.pres li span{color:var(--ink-2);max-width:70ch}
.presrow{display:flex;gap:12px;align-items:center}
.presclock{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.presclock.low{color:#b07a00} .presclock.over{color:var(--bad)}
.neglog li.fresh{animation:revealTxt .01s var(--d,0s) both}
.neglog li.fresh .txt>span{animation:revealTxt .01s calc(1.1s + var(--d,0s)) both}
.neglog li.fresh .txt::after{animation:typing 1.1s steps(3,end) var(--d,0s) both}
table.live td{white-space:normal;text-align:left;vertical-align:top}
table.live td:first-child{white-space:nowrap}
table.live .tag{margin-left:6px}
table.live .btn.quiet{padding:0}
.devlist{margin:4px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2);max-width:46ch}
@media (max-width:620px){ thead th{white-space:normal} th,td{padding:5px 6px} }
</style>

    </div>
    <p id="foot"></p>
  </footer>
</div>

/* ================================================================ modell */
var T=0.206;
